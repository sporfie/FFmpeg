version: 2.1

orbs:
  aws-cli: circleci/aws-cli@4.1.3

jobs:
  # Builds sporfie/Dockerfile.nvidia and pushes it as server-cam-hw-base:<commit>, the base image
  # sporfie-server-cam's docker/Dockerfile.nvidia is built FROM. Bump the tag there to pick a new one up.
  # Uses a machine (x86) executor: the build compiles ffmpeg and its CUDA kernels against the CUDA
  # toolkit, which cannot run on the ARM runner nor in setup_remote_docker's small engine.
  build-and-push-server-cam-hw-base:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true
    resource_class: large
    environment:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "466556037113"
      ECR_REGISTRY: "466556037113.dkr.ecr.us-east-1.amazonaws.com"
      IMAGE_NAME: server-cam-hw-base
    steps:
      - checkout
      # Assume AWS role via OIDC (no static keys)
      - aws-cli/setup:
          role_arn: "arn:aws:iam::466556037113:role/circleci_role"
          region: "us-east-1"
      # Login to ECR using the temporary OIDC creds and push
      - run:
          name: Login to ECR
          command: |
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      # The context is the repository root: the image builds ffmpeg from these sources. A clean build
      # compiles some thirty dependencies first; with the layer cache only the ffmpeg layers re-run.
      - run:
          name: Build ffmpeg (nvidia)
          no_output_timeout: 60m
          command: |
            docker build -f sporfie/Dockerfile.nvidia -t "$ECR_REGISTRY/$IMAGE_NAME:$CIRCLE_SHA1" .
      - run:
          name: Push to ECR
          command: |
            docker push "$ECR_REGISTRY/$IMAGE_NAME:$CIRCLE_SHA1"
            echo "Pushed $ECR_REGISTRY/$IMAGE_NAME:$CIRCLE_SHA1"

workflows:
  version: 2

  # Only the sporfie branch: server-cam-hw-base tracks it, and branches cut from it carry this file too.
  build-and-push:
    jobs:
      - build-and-push-server-cam-hw-base:
          filters:
            branches:
              only: sporfie
